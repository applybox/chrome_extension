<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applybox Recruiter — Login preview</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        color: #0f172a;
        background: #fff;
        width: 400px;
        min-height: 640px;
      }
      .hero {
        background: #000;
        color: #fff;
        text-align: center;
        padding: 40px 24px 40px;
        position: relative;
        overflow: hidden;
      }
      .hero img { width: 80px; height: 80px; border-radius: 16px; margin-bottom: 20px; }
      .hero h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
      .hero p { margin-top: 4px; font-size: 13px; color: rgba(255,255,255,0.7); }
      .card {
        margin: 20px 16px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
        padding: 20px 16px 16px;
      }
      .card h2 { font-size: 18px; font-weight: 600; }
      .card .sub { font-size: 13px; color: #64748b; margin-top: 4px; margin-bottom: 16px; }
      .tabs { display: flex; gap: 4px; background: #f1f5f9; border-radius: 8px; padding: 4px; margin-bottom: 16px; }
      .tab { flex: 1; text-align: center; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 500; }
      .tab.active { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
      label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
      input {
        width: 100%;
        height: 40px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 0 12px;
        margin-bottom: 12px;
        font-size: 14px;
      }
      .btn-primary {
        width: 100%;
        height: 40px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 500;
        font-size: 14px;
        margin-top: 4px;
      }
      .divider { text-align: center; color: #94a3b8; font-size: 11px; text-transform: uppercase; margin: 20px 0 12px; position: relative; }
      .divider::before, .divider::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 38%;
        height: 1px;
        background: #e2e8f0;
      }
      .divider::before { left: 0; }
      .divider::after { right: 0; }
      .sso { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .btn-outline {
        height: 40px;
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        background: #fff;
        font-size: 13px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <img src="../../icons/icon128.png" alt="Applybox" />
      <h1>Applybox Recruiter</h1>
      <p>Import candidates from job boards and other CRMs</p>
    </div>
    <div class="card">
      <h2>Sign in</h2>
      <p class="sub">Access your Applybox account</p>
      <div class="tabs">
        <div class="tab active">Password</div>
        <div class="tab">OTP</div>
      </div>
      <label>Email</label>
      <input type="email" value="recruiter@agency.co.uk" readonly />
      <label>Password</label>
      <input type="password" value="••••••••" readonly />
      <button class="btn-primary" type="button">Sign in</button>
      <div class="divider">Or continue with</div>
      <div class="sso">
        <button class="btn-outline" type="button">Google</button>
        <button class="btn-outline" type="button">Microsoft</button>
      </div>
    </div>
  </body>
</html>
